<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網路行銷購物網</title>
  <style>
    #main {
      width: 1024px;
      height: 768px;
      margin: auto;
    }

    #top {
      width: 1024px;
      height: 120px;
      background: url(./images/0401.jpg);
    }

    #top a {
      font-size: 52px;
      font-family: "標楷體";
      color: #fff;
      text-decoration: none;
      text-shadow: 10px 10px 15px #333;
      /* 在 top 的任一範圍都可以點選到 a，以下兩步驟: */
      /* 1.轉型填滿父容器 */
      display: block;
      text-align: center;
      /* 2.將文字垂直居中 (適合單行文字) */
      line-height: 120px;
    }

    #marquee {
      width: 1024px;
      height: 30px;
      /* 將文字垂直居中 (適合單行文字) */
      line-height: 30px;
      font-size: 19px;
      font-family: "標楷體";
      color: #00f;
      /* 在 marquee 和 content 都有背景圖 0402 */
      background: url(./images/0402.jpg);
    }

    #content {
      width: 1024px;
      height: calc(768px - 120px - 30px - 78px);
      background: url(./images/0402.jpg);
    }

    /* iframe 建立後並不會填滿父容器，需要設定寬高 */
    iframe {
      width: 1024px;
      height: calc(768px - 120px - 30px - 78px);
    }

    #footer {
      width: 1024px;
      height: 78px;
      color: #fff;
      font-family: "標楷體";
      line-height: 2;
      text-align: left;
      background: #660;
    }

    #footer a {
      text-decoration: none;
      color: #fff;
    }

    /* 已拜訪過後的連結狀態 */
    /* 給評審看之前要記得清除瀏覽資料，才能恢復未點選狀態 */
    #footer a:visited {
      color: #f99;
    }
  </style>
</head>

<body>
  <!-- 不要忘記放音樂喔，會被扣 20 分 -->
  <!-- 用 chrome 放音樂要點一下標題回首頁等一下才會開始播放 -->
  <audio src="./music/0401.mp3" autoplay></audio>
  <div id="main">
    <div id="top"><a href="./index.html">流行精品購物網站</a></div>
    <div id="marquee">
      <marquee>大家來購物網！精品商品特價大拍賣！要買要快！</marquee>
    </div>
    <div id="content">
      <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
    </div>
    <div id="footer">
      <a href="./results/message.html" target="iframe">訪客留言版</a><br>
      網頁設計及維護：15黃正芳、最近更新日期：2026/05/26
    </div>
  </div>
</body>

</html>
