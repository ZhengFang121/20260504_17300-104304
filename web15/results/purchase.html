<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      background: #ff9;
      text-align: center;
      border-collapse: collapse;
      margin: auto;
    }

    td {
      border: 1px solid #333;
      width: 400px;
    }

    tr:nth-child(odd) {
      height: 100px;
    }

    tr:nth-child(even) {
      height: 150px;
    }

    img {
      height: 150px;
      /* 讓圖片垂直置中 */
      vertical-align: middle;
    }

    p {
      text-align: center;
    }
  </style>
</head>

<body>
  <form>
    <table>
      <tr>
        <td>真皮皮包</td>
        <td>真皮短夾</td>
      </tr>
      <tr>
        <td><img src="../images/0403.jpg"></td>
        <td><img src="../images/0404.jpg"></td>
      </tr>
      <tr>
        <td>
          <!-- 記得要有 name 屬性，要相同，表示同一組 -->
          <!-- radio 單選 -->
          <input type="radio" name="r1" value="購買" checked>購買
          <input type="radio" name="r1" value="不購買">不購買
          <input type="radio" name="r1" value="考慮中">考慮中
        </td>
        <td>
          <input type="radio" name="r2" value="購買">購買
          <input type="radio" name="r2" value="不購買">不購買
          <input type="radio" name="r2" value="考慮中" checked>考慮中
        </td>
      </tr>
    </table>
    <p>
      <input type="submit" value="送出" onclick="showMsg(form.r1.value,form.r2.value)">
      <input type="reset" value="重製">
    </p>
  </form>
  <script>
    function showMsg(m1, m2) {
      // ctrl + alt + , 可以叫出符號表
      confirm(`
      流行皮件選購確認:

      ●真皮皮包:${m1}
      ●真皮短夾:${m2}
      `)
    }
  </script>
</body>

</html>
