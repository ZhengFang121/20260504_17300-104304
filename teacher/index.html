<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網路行銷購物網</title>
  <style>
    #main {
      width: 1024px;
      height: 768px;
      margin: auto;
    }

    #top {
      width: 1024px;
      height: 120px;
      background: url("./images/0401.jpg");
    }

    #top a {
      font-size: 52px;
      font-family: "標楷體";
      color: #fff;
      text-decoration: none;
      text-shadow: 10px 10px 15px #333;
      text-align: center;
      /* 以下兩步驟：讓 a 可以在 top 任一範圍點選 */
      /* 1.轉型填滿父容器 */
      display: block;
      /* 2.將文字垂直居中（適合單行文字） */
      line-height: 120px;
    }

    #marquee {
      width: 1024px;
      height: 30px;
      font-size: 19px;
      font-family: "標楷體";
      color: #00f;
      /* 文字垂直置中 */
      line-height: 30px;
      /* 背景圖 marquee 與 content 都有 */
      background: url("./images/0402.jpg");
    }

    #content {
      width: 1024px;
      /* calc 注意運算符號的左右兩側要半形空白 */
      height: calc(768px - 120px - 30px - 78px);
      background: url("./images/0402.jpg");
    }

    /* iframe 建立完並不會填滿父容器，所以要設定 width、height */
    iframe {
      width: 1024px;
      height: calc(768px - 120px - 30px - 78px);
    }

    #footer {
      width: 1024px;
      height: 78px;
      color: #fff;
      line-height: 2;
      font-family: "標楷體";
      background: #660;
    }

    #footer a {
      color: #fff;
      text-decoration: none;
    }

    /* 已拜訪過後的連結狀態，給評審看時要清除瀏覽資料才能恢復未點選狀態，ctrl+shift+del */
    #footer a:visited {
      color: #f99;
    }
  </style>
</head>

<body>
  <!-- 不要忘記音樂，20 分喔 -->
  <!-- 如果用 chrome 測，需要點回首頁才會播放  -->
  <!-- Microsoft edge 不需要 -->
  <audio src="./music/0401.mp3" autoplay></audio>
  <div id="main">
    <div id="top"><a href="./index.html">流行精品購物網站</a></div>
    <div id="marquee">
      <marquee>大家來購物網！精品商品特價大拍賣！要買要快！</marquee>
    </div>
    <div id="content">
      <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
    </div>
    <div id="footer">
      <a href="./results/message.html" target="iframe">訪客留言版</a><br>
      網頁設計及維護：00張凱富、最近更新日期：2026/05/26
    </div>
  </div>
</body>

</html>
